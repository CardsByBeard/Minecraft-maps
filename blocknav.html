<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b3b3b">
<title>BlockNav</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#c6c6c6; --hi:#ffffff; --lo:#555555; --ink:#373737; --black:#111;
  --slot:#8b8b8b; --gold:#ffff55; --xp:#80ff20; --xpdark:#2b6b00; --red:#b8322a; --green:#4f9a2a;
  --stoneTex:none; --plankTex:none;
  --body:"VT323", ui-monospace, Menlo, Consolas, monospace;
  --head:"Press Start 2P", "VT323", ui-monospace, monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#2b2b2b;font-family:var(--body);font-size:22px;color:var(--ink);overscroll-behavior:none}
#map{position:fixed;inset:0}
.maplibregl-canvas{image-rendering:pixelated;image-rendering:crisp-edges}
[hidden]{display:none!important}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* --- GUI pieces --- */
.panel{background:var(--panel);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 3px var(--black),0 6px 0 3px rgba(0,0,0,.35)}
.slot{background:var(--slot);border:3px solid;border-color:#373737 #fff #fff #373737;display:grid;place-items:center}
.btn{font-family:var(--body);font-size:24px;line-height:1;color:#fff;text-shadow:2px 2px 0 #3f3f3f;
  background:#7d7d7d var(--stoneTex);background-size:64px;image-rendering:pixelated;
  border:3px solid;border-color:#b5b5b5 #3c3c3c #3c3c3c #b5b5b5;outline:2px solid var(--black);
  padding:10px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.btn.on{border-color:#3c3c3c #b5b5b5 #b5b5b5 #3c3c3c;filter:brightness(.85)}
.btn:focus-visible{outline:3px solid var(--gold)}
.btn.go{background-color:#4f9a2a;background-blend-mode:multiply}
.btn.stop{background-color:#c0392b;background-blend-mode:multiply}
.btn.sq{width:52px;height:52px;padding:0}
.btn.sq img{width:30px;height:30px}

/* --- top --- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 12px) max(12px,var(--sr)) 0 max(12px,var(--sl));display:flex;flex-direction:column;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#searchPanel{padding:6px}
.searchRow{display:flex;gap:6px;align-items:center}
#q{flex:1;min-width:0;font-family:var(--body);font-size:26px;color:#fff;background:#000;border:3px solid #a0a0a0;padding:6px 10px;outline:none;border-radius:0}
#q::placeholder{color:#8a8a8a}
#q:focus{border-color:#fff}
#results{max-height:52vh;overflow:auto}
#results:empty{display:none}
.res{display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:2px solid #a7a7a7;cursor:pointer}
.res:first-child{margin-top:6px}
.res:hover,.res:focus{background:#b0b0b0;outline:none}
.res .tag{font-family:var(--head);font-size:9px;color:#fff;background:#555;padding:5px 6px;flex:none;text-shadow:1px 1px 0 #000}
.res .t1{color:#1e1e1e;font-size:24px;line-height:1}
.res .t2{color:#555;font-size:19px;line-height:1.05}
.res>div{min-width:0}
.res .t1,.res .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#banner{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#9c7c49 var(--plankTex);background-size:64px;image-rendering:pixelated;
  border:4px solid;border-color:#c9a86a #5a4320 #5a4320 #c9a86a;box-shadow:0 0 0 3px var(--black),0 6px 0 3px rgba(0,0,0,.35)}
#banner .slot{width:84px;height:84px;flex:none}
#banner .slot img{width:66px;height:66px}
.btext{min-width:0;color:#fff;text-shadow:2px 2px 0 #3a2a12}
#bDist{font-family:var(--head);font-size:24px;line-height:1.1;color:var(--gold)}
#bText{font-size:30px;line-height:1}
#bName{font-size:24px;line-height:1;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#then{align-self:flex-start;display:flex;gap:6px;align-items:center;padding:4px 10px 4px 8px;font-size:22px;color:#fff;background:#3a3a3a;border:3px solid;border-color:#666 #1b1b1b #1b1b1b #666;outline:2px solid #000;text-shadow:2px 2px 0 #000}
#then img{width:28px;height:28px}

/* --- side buttons --- */
#side{position:fixed;right:max(12px,calc(var(--sr) + 8px));top:calc(var(--st) + 96px);display:flex;flex-direction:column;gap:10px;z-index:4}
body.nav #side{top:calc(var(--st) + 150px)}
#recenter{position:fixed;left:50%;transform:translateX(-50%);z-index:6}
#speed{position:fixed;left:max(12px,var(--sl));z-index:4;padding:4px 10px;text-align:center;line-height:1}
#speed b{display:block;font-family:var(--head);font-size:18px;color:#1e1e1e}
#speed span{font-size:18px;color:#555}

/* --- bottom --- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(12px,var(--sr)) calc(var(--sb) + 12px) max(12px,var(--sl))}
.bottom .panel{padding:12px}
#dTitle{font-size:32px;line-height:1;color:#1e1e1e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dSub{font-size:20px;color:#555;line-height:1.1;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hotbar{display:flex;gap:0;margin:12px 0 8px;width:max-content;max-width:100%;background:#000;padding:3px}
.hslot{width:84px;height:76px;background:#8b8b8b;border:3px solid;border-color:#373737 #ddd #ddd #373737;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--body);padding:0}
.hslot img{width:40px;height:30px;object-fit:contain}
.hslot span{font-size:20px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;line-height:1}
.hslot.sel{outline:4px solid #fff;outline-offset:-1px;z-index:1;background:#a3a3a3}
.hslot:focus-visible{outline:4px solid var(--gold)}
#summary{font-size:24px;color:#1e1e1e;margin:4px 0 10px}
#summary .big{font-family:var(--head);font-size:16px;color:#2d6b10}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .grow{flex:1}
.attr{font-size:15px;color:#666;margin-top:8px;line-height:1}
.attr a{color:#444}
#attrFloat{position:fixed;left:max(8px,var(--sl));bottom:calc(var(--sb) + 4px);font-size:14px;color:#fff;text-shadow:1px 1px 0 #000;z-index:3;opacity:.85}
#attrFloat a{color:#fff}

/* nav bar */
#xpWrap{position:relative;margin:2px 0 10px}
#xpLevel{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-family:var(--head);font-size:18px;color:var(--xp);
  text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000}
.xp{height:16px;background:#1c1c1c;border:2px solid #000;position:relative;overflow:hidden}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5.55% - 2px),#000 calc(5.55% - 2px) 5.55%);opacity:.75}
#xpFill{height:100%;width:0;background:linear-gradient(#b6ff6a 0 30%,var(--xp) 30% 70%,#4fb10f 70%);transition:width .6s linear}
.navrow{display:flex;align-items:center;gap:12px}
.navrow .stat{flex:1;min-width:0}
.stat b{display:block;font-family:var(--head);font-size:15px;color:#1e1e1e;line-height:1.2}
.stat span{font-size:19px;color:#555;line-height:1}

/* toasts */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 100px);z-index:20;padding:6px 14px;font-size:22px;color:#fff;background:rgba(16,16,16,.88);border:2px solid #000;text-shadow:2px 2px 0 #000;max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#adv{position:fixed;right:max(12px,var(--sr));top:calc(var(--st) + 12px);z-index:30;display:flex;gap:10px;align-items:center;padding:10px 14px 10px 10px;background:#212121;border:3px solid;border-color:#6b6b6b #0e0e0e #0e0e0e #6b6b6b;outline:2px solid #000;max-width:calc(100% - 24px);transform:translateX(130%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#adv.show{transform:none}
#adv .slot{width:52px;height:52px;flex:none}
#adv .slot img{width:36px;height:36px}
#adv b{display:block;font-family:var(--head);font-size:12px;color:var(--gold);line-height:1.5}
#adv span{color:#fff;font-size:22px;line-height:1}

/* markers */
.me{width:46px;height:46px;position:relative}
.me img{width:46px;height:46px}
.me::before{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);background:radial-gradient(rgba(120,200,255,.35),transparent 65%)}
.dest{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.beam{width:10px;height:150px;background:linear-gradient(to top,rgba(200,240,255,.95),rgba(120,200,255,.1));box-shadow:0 0 14px 4px rgba(150,220,255,.5);animation:beam 1.2s steps(4) infinite}
@keyframes beam{50%{opacity:.7}}
.dest img{width:44px;height:44px;margin-top:-6px}
@media (prefers-reduced-motion:reduce){.beam{animation:none}#adv{transition:none}#xpFill{transition:none}}

#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#3b2a1a var(--plankTex);background-size:96px;image-rendering:pixelated;text-align:center;padding:24px}
#boot .panel{padding:20px;max-width:420px}
#boot h1{font-family:var(--head);font-size:20px;color:#1e1e1e;margin:0 0 12px;line-height:1.4}
#boot p{margin:0 0 16px;font-size:22px;line-height:1.1;color:#333}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="searchPanel" class="panel">
    <div class="searchRow">
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search" placeholder="Search a place">
      <button id="qClear" class="btn sq" aria-label="Clear" hidden>X</button>
    </div>
    <div id="results" role="listbox"></div>
  </div>
  <div id="banner" hidden>
    <div class="slot"><img id="bIcon" class="px" alt=""></div>
    <div class="btext"><div id="bDist"></div><div id="bText"></div><div id="bName"></div></div>
  </div>
  <div id="then" hidden><span id="thenLbl">Then</span><img id="thenIcon" class="px" alt=""></div>
</div>

<div id="side">
  <button id="btnCenter" class="btn sq" aria-label="My location"><img id="compassImg" class="px" alt=""></button>
  <button id="btn3d" class="btn sq" aria-label="Toggle 3D">3D</button>
  <button id="btnChunky" class="btn sq" aria-label="Toggle chunky pixels"><img id="chunkyImg" class="px" alt=""></button>
  <button id="btnVoice" class="btn sq" aria-label="Toggle voice"><img id="voiceImg" class="px" alt=""></button>
  <button id="btnLang" class="btn sq" aria-label="Language">EN</button>
</div>

<div id="speed" class="panel" hidden><b id="spdVal">0</b><span>km/h</span></div>
<button id="recenter" class="btn" hidden>Re-center</button>

<div id="sheet" class="bottom" hidden>
  <div class="panel">
    <div id="dTitle"></div>
    <div id="dSub"></div>
    <div class="hotbar" id="hotbar">
      <button class="hslot" data-mode="car"><img class="px" alt=""><span>…</span></button>
      <button class="hslot" data-mode="bike"><img class="px" alt=""><span>…</span></button>
      <button class="hslot" data-mode="walk"><img class="px" alt=""><span>…</span></button>
    </div>
    <div id="summary"></div>
    <div class="row">
      <button id="btnStart" class="btn go grow">Start</button>
      <button id="btnSim" class="btn">Demo</button>
      <button id="btnHome" class="btn">Home</button>
      <button id="btnClose" class="btn sq" aria-label="Close">X</button>
    </div>
    <div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · OpenFreeMap · OpenMapTiles · Routing FOSSGIS OSRM</div>
  </div>
</div>

<div id="navbar" class="bottom" hidden>
  <div class="panel">
    <div id="xpWrap"><div id="xpLevel">0</div><div class="xp"><div id="xpFill"></div></div></div>
    <div class="navrow">
      <div class="stat"><b id="nEta">--:--</b><span id="nEtaL">arrival</span></div>
      <div class="stat"><b id="nDist">-</b><span id="nDistL">to go</span></div>
      <button id="btnEnd" class="btn stop">End</button>
    </div>
    <div class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · OpenFreeMap · OpenMapTiles</div>
  </div>
</div>

<div id="attrFloat">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · OpenFreeMap</div>
<div id="toast"></div>
<div id="adv"><div class="slot"><img id="advIcon" class="px" alt=""></div><div><b id="advTitle">Destination reached!</b><span id="advText"></span></div></div>

<div id="boot" hidden>
  <div class="panel">
    <h1>BlockNav</h1>
    <p id="bootMsg">Tap to enable your location and start exploring.</p>
    <button id="bootBtn" class="btn go">Play</button>
  </div>
</div>

<script>
"use strict";
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('bn_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bn_'+k, JSON.stringify(v)); }catch(e){} }
};
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R2D = 180/Math.PI, D2R = Math.PI/180;
function distLL(a, b){ // [lon,lat]
  const la1=a[1]*D2R, la2=b[1]*D2R, dla=la2-la1, dlo=(b[0]-a[0])*D2R;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 12742000*Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingLL(a, b){
  const la1=a[1]*D2R, la2=b[1]*D2R, dlo=(b[0]-a[0])*D2R;
  const y=Math.sin(dlo)*Math.cos(la2), x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dlo);
  return (Math.atan2(y,x)*R2D+360)%360;
}
async function getJSON(url, ms=12000){
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), ms);
  try{ const r = await fetch(url, {signal: ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

/* ================= textures (16x16 pixel art, scaled x4) ================= */
function texCanvas(draw, n=16){ const c=document.createElement('canvas'); c.width=c.height=n; draw(c.getContext('2d'), n); return c; }
function texImage(c, scale=4){
  const n=c.width, src=c.getContext('2d').getImageData(0,0,n,n).data, W=n*scale, out=new Uint8Array(W*W*4);
  for(let y=0;y<W;y++) for(let x=0;x<W;x++){ const si=(((y/scale)|0)*n+((x/scale)|0))*4, di=(y*W+x)*4; out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=255; }
  return {width:W, height:W, data:out};
}
function texURL(c, scale=4){ const o=document.createElement('canvas'); o.width=o.height=c.width*scale; const x=o.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(c,0,0,o.width,o.height); return o.toDataURL(); }
const noise = (cols, seed, extra) => (x, n) => { const r=rng(seed); for(let i=0;i<n;i++) for(let j=0;j<n;j++){ x.fillStyle=cols[(r()*cols.length)|0]; x.fillRect(i,j,1,1); } if(extra) extra(x,n,r); };
const GRASS = ['#5d9b3a','#67a843','#548f33','#71b34c','#5d9b3a','#62a13e'];
const TEX = {
  grass:   noise(GRASS, 11),
  flowers: noise(['#4f8f30','#5a9c38','#47822b','#62a640'], 12, (x,n,r)=>{ [['#e8483a',2],['#f3d43a',2],['#f4f4f4',1],['#9b6cd8',1]].forEach(([c,k])=>{ for(let i=0;i<k;i++){ x.fillStyle=c; x.fillRect((r()*n)|0,(r()*n)|0,1,1);} }); }),
  leaves:  noise(['#2f6b22','#3b7d2a','#28601d','#447f30','#1f4f17','#336f25'], 13),
  water:   noise(['#3354c8','#3a5ed4','#2f4dbb','#3658cc'], 14, (x,n,r)=>{ x.fillStyle='#5b7ff0'; for(let i=0;i<4;i++) x.fillRect((r()*n)|0,(r()*n)|0,3,1); }),
  sand:    noise(['#dbd3a0','#e3dbab','#cfc690','#d8d09c'], 15),
  wet:     noise(['#4d6b3a','#56743f','#3f5f33','#4a6fa0','#4d6b3a'], 16),
  farmland:(x,n)=>{ const r=rng(17); for(let j=0;j<n;j++) for(let i=0;i<n;i++){ const c = (j%4<2) ? ['#6b4a2b','#5e4024','#74512f'] : ['#7fa83a','#8cb543','#6f9631','#b8a74a']; x.fillStyle=c[(r()*c.length)|0]; x.fillRect(i,j,1,1);} },
  stonebrick:(x,n)=>{ noise(['#7b7b7b','#848484','#727272','#7f7f7f'],18)(x,n); x.fillStyle='#545454'; for(let row=0;row<4;row++){ const y=row*4+3; x.fillRect(0,y,n,1); const off=(row%2)*4; x.fillRect(off,row*4,1,3); x.fillRect(off+8,row*4,1,3); } },
  bricks:(x,n)=>{ noise(['#9a5f45','#8f573f','#a3664b','#945b42'],19)(x,n); x.fillStyle='#b8aea2'; for(let row=0;row<4;row++){ const y=row*4+3; x.fillRect(0,y,n,1); const off=(row%2)?2:6; x.fillRect(off,row*4,1,3); x.fillRect((off+8)%16,row*4,1,3); } },
  planks:(x,n)=>{ noise(['#a2824e','#a98953','#9a7a48','#a5854f'],20)(x,n); x.fillStyle='#73582f'; const seams=[11,4,14,7]; for(let row=0;row<4;row++){ x.fillRect(0,row*4+3,n,1); x.fillRect(seams[row],row*4,1,3); } },
  stone:   noise(['#7d7d7d','#858585','#747474','#8a8a8a','#6f6f6f'], 21),
  gravel:  noise(['#8a8580','#7a7570','#9a958f','#6c6762'], 22)
};
const texCache = {};
function texFor(id){ if(!texCache[id] && TEX[id]) texCache[id] = texCanvas(TEX[id]); return texCache[id]; }
document.documentElement.style.setProperty('--stoneTex', `url(${texURL(texFor('stone'))})`);
document.documentElement.style.setProperty('--plankTex', `url(${texURL(texFor('planks'))})`);

/* ================= pixel icons ================= */
function pix(w, h, draw, {outline='#1b1b1b', scale=4} = {}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x);
  const d=x.getImageData(0,0,w,h), a=d.data, solid=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){ if(a[i*4+3]>110){ solid[i]=1; a[i*4+3]=255; } else a[i*4+3]=0; }
  if(outline){ const oc=parseInt(outline.slice(1),16); for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=y*w+xx; if(solid[i]) continue;
      if((xx>0&&solid[i-1])||(xx<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){ a[i*4]=oc>>16; a[i*4+1]=(oc>>8)&255; a[i*4+2]=oc&255; a[i*4+3]=255; } } }
  x.putImageData(d,0,0);
  const o=document.createElement('canvas'); o.width=w*scale; o.height=h*scale; const ox=o.getContext('2d'); ox.imageSmoothingEnabled=false; ox.drawImage(c,0,0,o.width,o.height); return o.toDataURL();
}
function grid(rows, pal, scale=4){

function instr(step){
  const m=step.maneuver||{}, type=m.type, mod=m.modifier||'straight', en=lang==='en';

  const side = mod.includes('left') ? (en?'left':'links') : mod.includes('right') ? (en?'right':'rechts') : '';

  const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  const cardEN=['north','northeast','east','southeast','south','southwest','west','northwest'], cardNL=['het noorden','het noordoosten','het oosten','het zuidoosten','het zuiden','het zuidwesten','het westen','het noordwesten'];
  const ci = Math.round(((m.bearing_after||0)%360)/45)%8;
  let text, key;
  switch(type){
    case 'depart': text = en ? `Head ${cardEN[ci]}` : `Ga richting ${cardNL[ci]}`; key='straight'; break;
    case 'arrive': text = en ? 'Arrive at your destination' : 'Aankomst op je bestemming'; key='arrive'; break;
    case 'roundabout': case 'rotary': case 'roundabout turn':
      text = m.exit ? (en ? `At the roundabout, take the ${ord(m.exit)} exit` : `Neem op de rotonde de ${m.exit}e afslag`) : (en ? 'Go through the roundabout' : 'Ga over de rotonde'); key='rb_'+mod; break;

    case 'fork': text = en ? `Keep ${side||'straight'} at the fork` : `Houd ${side||'rechtdoor'} aan bij de splitsing`; key = side ? 'slight '+(mod.includes('left')?'left':'right') : 'straight'; break;
    case 'merge': text = en ? `Merge ${side}`.trim() : `Voeg in${side?' naar '+side:''}`; key = side ? 'slight '+(mod.includes('left')?'left':'right') : 'straight'; break;
    case 'on ramp': text = en ? `Take the ramp${side?' on the '+side:''}` : `Neem de oprit${side?' '+side:''}`; key = side ? 'slight '+(mod.includes('left')?'left':'right') : 'straight'; break;

  }

}

function startGPS(){
  if(!('geolocation' in navigator)) { toast(t('denied'), 6000); return; }
  if(!window.isSecureContext){ toast(t('insecure'), 8000); }
  if(watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(p => onPos(p,false), err => {
    if(err.code===1) toast(window.isSecureContext ? t('denied') : t('insecure'), 7000);
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
function onPos(p, simulated){
  if(sim && !simulated) return;
  const c=p.coords, cur=[c.longitude,c.latitude];
  let heading = me ? me.heading : null;
  if(c.heading!=null && !isNaN(c.heading) && (c.speed||0) > 0.8) heading = c.heading;
  else if(lastHeadPos && distLL(lastHeadPos,cur) > 8) heading = bearingLL(lastHeadPos,cur);
  else if(compassHeading!=null && (c.speed||0) < 0.8) heading = compassHeading;
  if(!lastHeadPos || distLL(lastHeadPos,cur) > 8) lastHeadPos = cur;
  me = {lat:c.latitude, lon:c.longitude, acc:c.accuracy||0, speed:c.speed, heading};
  if(state==='nav' && route){ navTick(); }
  updateMeMarker();
  $('#spdVal').textContent = c.speed!=null && c.speed>=0 ? Math.round(c.speed*3.6) : '–';
  if(!firstFix){ firstFix=true; if(state==='browse'){ map.jumpTo({center:cur, zoom:Math.max(map.getZoom(),16)}); setFollow(true); } }
  else if(state==='browse' && follow) map.easeTo({center:cur, duration:800});
  if(state==='preview' && dest && !routes[mode] && !routes._loading) fetchAllModes();
}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) h = (360 - e.alpha) % 360;
  if(h!=null){ compassHeading = h; if(me && (me.speed==null || me.speed<0.8) && state!=='nav'){ me.heading=h; updateMeMarker(); } }
}
async function enableCompass(){

}

/* ================= routing ================= */
async function getRoute(a, b, m){
  const p={car:'car',bike:'bike',walk:'foot'}[m];
  const url=`https://routing.openstreetmap.de/routed-${p}/route/v1/driving/${a.lon.toFixed(6)},${a.lat.toFixed(6)};${b.lon.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true&alternatives=false`;
  const j=await getJSON(url, 15000);
  if(j.code!=='Ok' || !j.routes || !j.routes.length) throw new Error('noroute');
  return buildRoute(j.routes[0]);
}
function buildRoute(r){
  const coords=r.geometry.coordinates, cum=[0];
  for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+distLL(coords[i-1],coords[i]));
  const total=cum[cum.length-1]||0, steps=[]; let s=0;
  for(const leg of r.legs) for(const st of leg.steps){ steps.push({maneuver:st.maneuver, name:st.name, ref:st.ref, distance:st.distance, duration:st.duration, s}); s+=st.distance; }
  const k = s>0 ? total/s : 1;
  steps.forEach(st=>{ st.s*=k; st.d=st.distance*k; Object.assign(st, instr(st)); });
  return {coords, cum, total, duration:r.duration, steps};
}
function setRouteData(r){
  const fc = r ? {type:'Feature', geometry:{type:'LineString', coordinates:r.coords}} : {type:'FeatureCollection',features:[]};
  if(map.getSource('route')) map.getSource('route').setData(fc);
  if(map.getSource('routeDone')) map.getSource('routeDone').setData({type:'FeatureCollection',features:[]});
}
function fitRoute(r){
  if(!r || r.coords.length<2) return;
  const b=new maplibregl.LngLatBounds(r.coords[0], r.coords[0]); r.coords.forEach(c=>b.extend(c));
  const sheetH = $('#sheet').offsetHeight || 300;
  map.fitBounds(b, {padding:{top:120, bottom:sheetH+30, left:40, right:80}, pitch:0, bearing:0, duration:900, maxZoom:17});
}

function project(p){
  const c=route.coords, kx=111320*Math.cos(p.lat*D2R), ky=110540; let best={d:Infinity,i:0,t:0,pt:c[0]};
  const scan=(a,b)=>{ for(let i=Math.max(0,a);i<Math.min(c.length-1,b);i++){
    const ax=(c[i][0]-p.lon)*kx, ay=(c[i][1]-p.lat)*ky, bx=(c[i+1][0]-p.lon)*kx, by=(c[i+1][1]-p.lat)*ky, dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
    let tt = L2 ? -(ax*dx+ay*dy)/L2 : 0; tt=Math.max(0,Math.min(1,tt)); const d=Math.hypot(ax+tt*dx, ay+tt*dy);
    if(d<best.d) best={d,i,t:tt,pt:[c[i][0]+(c[i+1][0]-c[i][0])*tt, c[i][1]+(c[i+1][1]-c[i][1])*tt]}; } };
  scan(lastIdx-3, lastIdx+400); if(best.d>60) scan(0, c.length);
  const i=best.i; best.s = route.cum[i] + ((route.cum[i+1]||route.cum[i]) - route.cum[i]) * best.t;
  let j=i; while(j<c.length-1 && c[j][0]===c[j+1][0] && c[j][1]===c[j+1][1]) j++;
  best.bear = j<c.length-1 ? bearingLL(c[j],c[j+1]) : (me&&me.heading)||0;
  lastIdx=i; return best;
}
function navTick(){
  if(!route || !me || route.coords.length<2) return;
  const P = navProj = project(me), s=P.s, st=route.steps;
  const lim=(mode==='car'?40:28) + Math.min(me.acc||0,40)*0.5;
  if(P.d>lim){ offCount++; if(offCount>=3 && Date.now()-lastReroute>8000) reroute(); } else offCount=0;
  let k=st.findIndex((x,i)=>i>0 && x.s > s+3); if(k<0) k=st.length-1;
  const nx=st[k], dNext=Math.max(0, nx.s - s);
  $('#bIcon').src=icon(nx.key); $('#bDist').textContent=fmtDist(dNext); $('#bText').textContent=nx.text; $('#bName').textContent=nx.nameLine;
  const n2=st[k+1];
  if(n2 && n2.s - nx.s < 150 && nx.key!=='arrive'){ $('#then').hidden=false; $('#thenIcon').src=icon(n2.key); } else $('#then').hidden=true;
  const remaining=Math.max(0, route.total - s);
  let rem=0; for(let j=k;j<st.length;j++) rem+=st[j].duration; const prev=st[k-1]; if(prev && prev.d>0) rem+=prev.duration*Math.min(1,Math.max(0,dNext/prev.d));
  $('#nEta').textContent=clockIn(rem); $('#nDist').textContent=fmtDist(remaining);
  $('#xpLevel').textContent=Math.max(0,Math.round(rem/60)); $('#xpFill').style.width=(route.total? Math.min(100, s/route.total*100) : 0)+'%';
  if(map.getSource('routeDone')) map.getSource('routeDone').setData({type:'Feature',geometry:{type:'LineString',coordinates:[...route.coords.slice(0,P.i+1), P.pt]}});
  announce(k, nx, dNext);
  if(remaining < 15 || (dest && distLL([me.lon,me.lat],[dest.lon,dest.lat]) < (mode==='car'?30:18))) { arrive(); return; }
  navCamera(false);
}
function navCamera(force){
  if(!follow || !me) return;
  const sp=me.speed||0, z = mode==='car' ? (sp>25?15.8:sp>14?16.6:17.3) : mode==='bike' ? 17.6 : 18.2;
  const onRoute = navProj && navProj.d < 25;
  const center = onRoute ? navProj.pt : [me.lon,me.lat];
  const bearing = onRoute ? navProj.bear : (me.heading!=null ? me.heading : map.getBearing());
  map.easeTo({center, zoom:z, bearing, pitch: threeD?55:0, duration: force?600:(sim?480:950), easing:x=>x, offset:[0, Math.round(window.innerHeight*0.18)]});
}
function announce(k, nx, d){
  const sp=me.speed||8;
  const th = mode==='car' ? [['far',900],['mid',300],['now',Math.max(45, sp*4)]] : mode==='bike' ? [['mid',160],['now',35]] : [['mid',70],['now',15]];
  const done = ann[k] || (ann[k]=new Set()); let chosen=null;
  for(const [tag,lim] of th){ if(d<=lim && !done.has(tag)) chosen=tag; }
  if(!chosen) return;
  for(const [tag,lim] of th){ done.add(tag); if(tag===chosen) break; }
  const segLen = nx.s - (route.steps[k-1] ? route.steps[k-1].s : 0);
  if(chosen==='far' && segLen < 1300) return;
  if(chosen==='now' && nx.key==='arrive') return;
  const phrase = `${nx.text}${nx.nameLine && nx.key!=='arrive' ? ' '+nx.nameLine : ''}`;
  speak(chosen==='now' ? phrase : `${t('in')} ${fmtDist(d,true)}, ${phrase[0].toLowerCase()+phrase.slice(1)}`);
}
async function reroute(){
  if(rerouting || !dest) return; rerouting=true; lastReroute=Date.now(); toast(t('reroute')); speak(t('reroute').replace('…',''));
  try{ const r=await getRoute(me,dest,mode); if(state==='nav'){ route=r; ann={}; lastIdx=0; offCount=0; setRouteData(r); } }catch(e){}
  rerouting=false;
}
function arrive(){
  const name = dest ? dest.name : '';
  speak(t('arrivedVoice'));
  $('#advTitle').textContent=t('arrived'); $('#advText').textContent=name; $('#advIcon').src=icon('arrive');
  const adv=$('#adv'); adv.classList.add('show'); setTimeout(()=>adv.classList.remove('show'), 5000);
  endNav();
}

/* ================= demo drive ================= */
function pointAt(s){
  const c=route.cum; let lo=0, hi=c.length-1; while(lo<hi-1){ const m=(lo+hi)>>1; if(c[m]<=s) lo=m; else hi=m; }
  const a=route.coords[lo], b=route.coords[hi]||a, seg=(c[hi]-c[lo])||1, f=Math.min(1,Math.max(0,(s-c[lo])/seg));
  return {pt:[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f], bear: a===b ? 0 : bearingLL(a,b)};
}
function startSim(){
  stopSim(); let s=0; const sp={car:16,bike:6,walk:2.2}[mode]*2;
  const tick=()=>{ if(!route || state!=='nav'){ stopSim(); return; }
    s = Math.min(route.total, s + sp*0.5);
    const {pt,bear}=pointAt(s);
    onPos({coords:{latitude:pt[1], longitude:pt[0], accuracy:5, speed:sp, heading:bear}}, true);
  };
  sim = setInterval(tick, 500); tick();
}
function stopSim(){ if(sim){ clearInterval(sim); sim=null; } }

/* ================= voice / wake ================= */
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang = lang==='nl' ? 'nl-NL' : 'en-GB';
    const v=speechSynthesis.getVoices().find(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith(lang)); if(v) u.voice=v; u.rate=1.03; speechSynthesis.speak(u); }catch(e){}
}
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && state==='nav') requestWake(); });

/* ================= controls ================= */
function toast(msg, ms=2600){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), ms); }
function layoutSpeed(){ const b=$('#banner'); $('#speed').style.top = (b.getBoundingClientRect().bottom + 56) + 'px'; }
window.addEventListener('resize', ()=>{ if(state==='nav') layoutSpeed(); });
function layoutRecenter(){ $('#recenter').style.bottom = `calc(${$('#navbar').offsetHeight || 140}px + 16px)`; }
new ResizeObserver(layoutRecenter).observe($('#navbar'));

$('#compassImg').src=IMG.compass; $('#chunkyImg').src=IMG.chunky; $('#voiceImg').src=voiceOn?IMG.voiceOn:IMG.voiceOff;
$('#btnCenter').addEventListener('click', ()=>{
  enableCompass();
  if(state==='nav'){ setFollow(true); navCamera(true); return; }
  if(!me){ startGPS(); toast(t('noloc')); return; }
  if(follow && Math.abs(map.getBearing())>1) { map.easeTo({bearing:0, duration:500}); return; }
  setFollow(true); map.easeTo({center:[me.lon,me.lat], zoom:Math.max(map.getZoom(),16), duration:700});
});
$('#btn3d').addEventListener('click', ()=>{ threeD=!threeD; store.set('3d',threeD); apply3D(true); });
$('#btnChunky').addEventListener('click', ()=>{ chunky=!chunky; store.set('chunky',chunky); $('#btnChunky').classList.toggle('on',chunky); if(map.setPixelRatio) map.setPixelRatio(chunky?0.5:(window.devicePixelRatio||1)); });
$('#btnChunky').classList.toggle('on',chunky);
$('#btnVoice').addEventListener('click', ()=>{ voiceOn=!voiceOn; store.set('voice',voiceOn); $('#voiceImg').src=voiceOn?IMG.voiceOn:IMG.voiceOff; $('#btnVoice').classList.toggle('on',!voiceOn); if(voiceOn) speak(lang==='nl'?'Spraak aan':'Voice on'); else try{speechSynthesis.cancel()}catch(e){} });
$('#btnLang').addEventListener('click', ()=>{ lang = lang==='nl'?'en':'nl'; store.set('lang',lang); applyLang(); });
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = ()=>{};

/* ================= boot ================= */
applyLang();
const seen = store.get('seen', false);
function boot(){ $('#boot').hidden=true; store.set('seen',true); startGPS(); enableCompass(); setTimeout(()=>toast(t('hint'), 3500), 1500); }
if(!seen){ $('#boot').hidden=false; $('#bootBtn').addEventListener('click', boot); }
else startGPS();
</script>
</body>
</html>
