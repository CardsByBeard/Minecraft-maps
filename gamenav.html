<!doctype html>
<html lang="en" data-skin="blocks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b3b3b">
<title>GameNav</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=IM+Fell+English&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* ============ layout (shared by every theme) ============ */
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--stoneTex:none;--plankTex:none;--parchTex:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);font-size:var(--fs);color:var(--p-fg);background:var(--map-bg)}
#map{position:fixed;inset:0;background:var(--map-bg)}
[hidden]{display:none!important}
img.px{display:block}
html[data-pixel="1"] img.px,html[data-pixel="1"] .maplibregl-canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 12px) max(12px,var(--sr)) 0 max(12px,var(--sl));display:flex;flex-direction:column;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#searchPanel{padding:6px}
.searchRow{display:flex;gap:6px;align-items:center}
#q{flex:1;min-width:0;font-family:var(--fb);font-size:var(--i-fs);color:var(--i-fg);background:var(--i-bg);border:var(--i-bd);border-radius:var(--i-r,0);padding:8px 10px;outline:none;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--p-mut)}
#q:focus{border-color:var(--i-focus)}
#results{max-height:52vh;overflow:auto}
#results:empty{display:none}
.res{display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:2px solid var(--res-sep);cursor:pointer}
.res:first-child{margin-top:6px}
.res:hover,.res:focus{background:var(--res-hover);outline:none}
.res .tag{font-family:var(--fh);font-size:var(--tag-fs);color:var(--tag-fg);background:var(--tag-bg);padding:5px 7px;flex:none;border-radius:var(--b-r,0);letter-spacing:.04em}
.res>div{min-width:0}
.res .t1{color:var(--p-fg);font-size:var(--t1-fs);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t2{color:var(--p-mut);font-size:var(--t2-fs);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{background:var(--p-bg);background-size:var(--p-bgs,auto);color:var(--p-fg);border:var(--p-bd);border-color:var(--p-bc);box-shadow:var(--p-sh);border-radius:var(--p-r,0);clip-path:var(--p-clip,none)}
.slot{background:var(--s-bg);border:var(--s-bd);border-color:var(--s-bc);border-radius:var(--s-r,0);display:grid;place-items:center}
.btn{font-family:var(--b-ff,var(--fb));font-size:var(--b-fs);font-weight:var(--b-fw,400);line-height:1;color:var(--b-fg);text-shadow:var(--b-ts,none);text-transform:var(--b-tt,none);letter-spacing:var(--b-ls,0);
  background:var(--b-bg);background-size:var(--b-bgs,auto);border:var(--b-bd);border-color:var(--b-bc);outline:var(--b-ol,none);box-shadow:var(--b-sh,none);border-radius:var(--b-r,0);clip-path:var(--b-clip,none);
  padding:10px 14px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active,.btn.on{background:var(--b-on-bg,var(--b-bg));background-size:var(--b-bgs,auto);color:var(--b-on-fg,var(--b-fg));border-color:var(--b-on-bc,var(--b-bc))}
.btn:focus-visible{outline:3px solid var(--focus)}
.btn.go{background:var(--go-bg);background-size:var(--b-bgs,auto);color:var(--go-fg);background-blend-mode:var(--b-blend,normal)}
.btn.stop{background:var(--stop-bg);background-size:var(--b-bgs,auto);color:var(--stop-fg);background-blend-mode:var(--b-blend,normal)}
.btn:disabled{opacity:.5}
.btn.sq{width:52px;height:52px;padding:0}
.btn.sq img{width:30px;height:30px}

#banner{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--bn-bg);background-size:var(--bn-bgs,auto);border:var(--bn-bd);border-color:var(--bn-bc);box-shadow:var(--bn-sh);border-radius:var(--bn-r,0);clip-path:var(--p-clip,none)}
#banner .slot{width:84px;height:84px;flex:none}
#banner .slot img{width:66px;height:66px}
.btext{min-width:0;color:var(--bn-fg);text-shadow:var(--bn-ts,none)}
#bDist{font-family:var(--fh);font-size:var(--bn-dist-fs);line-height:1.1;color:var(--bn-acc)}
#bText{font-size:var(--bn-text-fs);line-height:1.05}
#bName{font-size:var(--bn-name-fs);line-height:1.05;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#then{align-self:flex-start;display:flex;gap:6px;align-items:center;padding:4px 10px 4px 8px;font-size:var(--then-fs);color:var(--th-fg);background:var(--th-bg);border:var(--th-bd);border-radius:var(--b-r,0)}
#then img{width:28px;height:28px}

#side{position:fixed;right:max(12px,calc(var(--sr) + 8px));top:calc(var(--st) + 96px);display:flex;flex-direction:column;gap:10px;z-index:4}
body.nav #side{top:calc(var(--st) + 150px)}
#recenter{position:fixed;left:50%;transform:translateX(-50%);z-index:6}
#speed{position:fixed;left:max(12px,var(--sl));z-index:4;padding:4px 10px;text-align:center;line-height:1}
#speed b{display:block;font-family:var(--fh);font-size:var(--stat-fs);color:var(--p-fg)}
#speed span{font-size:var(--small-fs);color:var(--p-mut)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(12px,var(--sr)) calc(var(--sb) + 12px) max(12px,var(--sl))}
.bottom .panel{padding:12px}
#dTitle{font-family:var(--title-ff,var(--fb));font-size:var(--title-fs);line-height:1.05;color:var(--p-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dSub{font-size:var(--t2-fs);color:var(--p-mut);line-height:1.1;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hotbar{display:flex;gap:var(--h-gap,0);margin:12px 0 8px;width:max-content;max-width:100%;background:var(--h-wrap);padding:var(--h-wrap-pad,0)}
.hslot{width:84px;height:76px;background:var(--h-bg);border:var(--h-bd);border-color:var(--h-bc);border-radius:var(--h-r,0);position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--fb);padding:0;clip-path:var(--b-clip,none)}
.hslot img{width:40px;height:30px;object-fit:contain}
.hslot span{font-size:var(--h-fs);color:var(--h-fg);text-shadow:var(--h-ts,none);line-height:1;font-weight:600}
.hslot.sel{background:var(--h-sel-bg);outline:var(--h-sel-ol,none);outline-offset:-1px;z-index:1}
.hslot.sel span{color:var(--h-sel-fg,var(--h-fg))}
.hslot:focus-visible{outline:3px solid var(--focus)}
#summary{font-size:var(--sum-fs);color:var(--p-fg);margin:4px 0 10px}
#summary .big{font-family:var(--fh);font-size:var(--sum-big-fs);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .grow{flex:1}
.attr{font-size:13px;font-family:system-ui,sans-serif;color:var(--p-mut);margin-top:8px;line-height:1.2}
.attr a{color:inherit}
#attrFloat{position:fixed;left:max(8px,var(--sl));bottom:calc(var(--sb) + 4px);font:12px system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #000,1px 1px 0 #000;z-index:3;opacity:.85}
#attrFloat a{color:#fff}

#xpWrap{position:relative;margin:var(--bar-mt,4px) 0 10px}
#xpLevel{display:var(--lvl-d,block);position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-family:var(--fh);font-size:18px;color:var(--lvl);text-shadow:var(--lvl-ts,none)}
.xp{height:var(--bar-h);background:var(--bar-bg);border:var(--bar-bd);position:relative;overflow:hidden;border-radius:var(--bar-r,0);transform:var(--bar-skew,none)}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5.55% - 2px),var(--bar-seg) calc(5.55% - 2px) 5.55%);opacity:var(--bar-segop,0)}
#xpFill{height:100%;width:0;background:var(--bar-fill);transition:width .6s linear;box-shadow:var(--bar-glow,none)}
.navrow{display:flex;align-items:center;gap:12px}
.navrow .stat{flex:1;min-width:0}
.stat b{display:block;font-family:var(--fh);font-size:var(--stat-fs);color:var(--p-fg);line-height:1.2}
.stat span{font-size:var(--small-fs);color:var(--p-mut);line-height:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 100px);z-index:20;padding:6px 14px;font-size:var(--toast-fs);color:var(--t-fg);background:var(--t-bg);border:var(--t-bd);border-radius:var(--b-r,0);max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}

#adv{position:fixed;z-index:30;display:flex;gap:10px;align-items:center;pointer-events:none;opacity:0;transition:opacity .4s,transform .45s cubic-bezier(.2,.9,.3,1.2)}
#adv.show{opacity:1}
#adv .slot{width:52px;height:52px;flex:none}
#adv .slot img{width:36px;height:36px}
#advTitle,#advText{display:block}

#skinSheet{z-index:40}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 12px;max-height:55vh;overflow:auto;padding:4px}
.skinCard{text-align:left;cursor:pointer;padding:8px;font-family:var(--fb);background:var(--h-bg);border:var(--h-bd);border-color:var(--h-bc);border-radius:var(--h-r,0);color:var(--h-fg);display:flex;flex-direction:column;gap:6px}
.skinCard.sel{outline:3px solid var(--focus);outline-offset:1px}
.skinCard .sw{display:flex;height:34px;border:2px solid rgba(0,0,0,.6)}
.skinCard .sw i{flex:1}
.skinCard b{font-size:var(--h-fs);line-height:1.05}
.skinCard small{font-size:calc(var(--h-fs) * .8);opacity:.85;line-height:1.1}
#skinTitle{font-family:var(--fh);font-size:var(--sum-big-fs);color:var(--p-fg)}

#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--boot-bg);background-size:96px;text-align:center;padding:24px}
#boot .panel{padding:20px;max-width:420px}
#boot h1{font-family:var(--fh);font-size:var(--sum-big-fs);color:var(--p-fg);margin:0 0 12px;line-height:1.4}
#boot p{margin:0 0 16px;font-size:var(--sum-fs);line-height:1.15;color:var(--p-mut)}

.me{width:46px;height:46px;position:relative}
.me img{width:46px;height:46px}
.me::before{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);background:radial-gradient(var(--me-halo,rgba(120,200,255,.35)),transparent 65%)}
.dest{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.dest img{width:44px;height:44px}
.beam{width:10px;height:150px;margin-bottom:-6px;background:linear-gradient(to top,rgba(200,240,255,.95),rgba(120,200,255,.1));box-shadow:0 0 14px 4px rgba(150,220,255,.5);animation:pulse 1.2s steps(4) infinite}
.cp{width:58px;height:84px;position:relative;margin-bottom:-10px}
.cp::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(240,200,80,.8),rgba(240,200,80,.05));border-radius:50% / 9px;animation:pulse 1.4s ease-in-out infinite}
.cp::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:18px;border-radius:50%;border:3px solid rgba(255,214,90,.95);box-shadow:0 0 10px rgba(255,214,90,.8)}
.blip{width:18px;height:18px;background:#b85ff0;border:3px solid #fff;transform:rotate(45deg);margin-top:6px;box-shadow:0 0 0 2px #000}
.nbeam{width:3px;height:150px;background:linear-gradient(to top,#00f0ff,transparent);box-shadow:0 0 12px 3px rgba(0,240,255,.6)}
.ndia{width:24px;height:24px;border:3px solid #fcee0a;transform:rotate(45deg);box-shadow:0 0 12px rgba(252,238,10,.9),inset 0 0 8px rgba(252,238,10,.7);margin-top:-6px;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.beam,.cp::before,.ndia{animation:none}#adv,#xpFill{transition:none}}

/* ============ THEME: Pixel Blocks ============ */
html[data-skin="blocks"]{
  --fb:"VT323",ui-monospace,Menlo,monospace; --fh:"Press Start 2P","VT323",monospace; --fs:22px;
  --map-bg:#5d9b3a; --focus:#ffff55; --accent:#2d6b10;
  --p-bg:#c6c6c6; --p-fg:#1e1e1e; --p-mut:#555; --p-bd:4px solid; --p-bc:#fff #555 #555 #fff; --p-sh:0 0 0 3px #111,0 6px 0 3px rgba(0,0,0,.35);
  --s-bg:#8b8b8b; --s-bd:3px solid; --s-bc:#373737 #fff #fff #373737;
  --b-bg:#7d7d7d var(--stoneTex); --b-bgs:64px; --b-fg:#fff; --b-fs:24px; --b-ts:2px 2px 0 #3f3f3f; --b-bd:3px solid; --b-bc:#b5b5b5 #3c3c3c #3c3c3c #b5b5b5; --b-ol:2px solid #111; --b-on-bc:#3c3c3c #b5b5b5 #b5b5b5 #3c3c3c; --b-on-bg:#5f5f5f var(--stoneTex); --b-blend:multiply;
  --go-bg:#4f9a2a var(--stoneTex); --go-fg:#fff; --stop-bg:#c0392b var(--stoneTex); --stop-fg:#fff;
  --i-bg:#000; --i-fg:#fff; --i-bd:3px solid #a0a0a0; --i-focus:#fff; --i-fs:26px;
  --res-sep:#a7a7a7; --res-hover:#b0b0b0; --tag-bg:#555; --tag-fg:#fff; --tag-fs:9px; --t1-fs:24px; --t2-fs:19px;
  --bn-bg:#9c7c49 var(--plankTex); --bn-bgs:64px; --bn-bd:4px solid; --bn-bc:#c9a86a #5a4320 #5a4320 #c9a86a; --bn-sh:0 0 0 3px #111,0 6px 0 3px rgba(0,0,0,.35); --bn-fg:#fff; --bn-ts:2px 2px 0 #3a2a12; --bn-acc:#ffff55; --bn-dist-fs:24px; --bn-text-fs:30px; --bn-name-fs:24px;
  --th-bg:#3a3a3a; --th-fg:#fff; --th-bd:3px solid #1b1b1b; --then-fs:22px;
  --h-wrap:#000; --h-wrap-pad:3px; --h-bg:#8b8b8b; --h-bd:3px solid; --h-bc:#373737 #ddd #ddd #373737; --h-fg:#fff; --h-ts:2px 2px 0 #3f3f3f; --h-fs:20px; --h-sel-bg:#a3a3a3; --h-sel-ol:4px solid #fff;
  --title-fs:32px; --sum-fs:24px; --sum-big-fs:16px; --stat-fs:15px; --small-fs:19px; --toast-fs:22px;
  --bar-h:16px; --bar-bg:#1c1c1c; --bar-bd:2px solid #000; --bar-fill:linear-gradient(#b6ff6a 0 30%,#80ff20 30% 70%,#4fb10f 70%); --bar-seg:#000; --bar-segop:.75; --bar-mt:26px;
  --lvl:#80ff20; --lvl-ts:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000;
  --t-bg:rgba(16,16,16,.88); --t-fg:#fff; --t-bd:2px solid #000;
  --boot-bg:#3b2a1a var(--plankTex);
}
html[data-skin="blocks"] #adv{right:max(12px,var(--sr));top:calc(var(--st) + 12px);padding:10px 14px 10px 10px;background:#212121;border:3px solid;border-color:#6b6b6b #0e0e0e #0e0e0e #6b6b6b;outline:2px solid #000;transform:translateX(130%)}
html[data-skin="blocks"] #adv.show{transform:none}
html[data-skin="blocks"] #advTitle{font-family:var(--fh);font-size:12px;color:#ffff55;line-height:1.5}
html[data-skin="blocks"] #advText{color:#fff;font-size:22px}
html[data-skin="blocks"] #toast,html[data-skin="blocks"] #then{text-shadow:2px 2px 0 #000}

/* ============ THEME: Street Map ============ */
html[data-skin="street"]{
  --fb:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --fh:"Anton","Impact","Arial Narrow",sans-serif; --fs:18px;
  --map-bg:#2f3437; --focus:#f0c850; --accent:#f0c850;
  --p-bg:rgba(0,0,0,.78); --p-fg:#ffffff; --p-mut:#b9bec2; --p-bd:0 solid; --p-bc:transparent; --p-sh:0 4px 18px rgba(0,0,0,.5);
  --s-bg:rgba(255,255,255,.08); --s-bd:0 solid; --s-bc:transparent;
  --b-bg:rgba(0,0,0,.78); --b-fg:#fff; --b-fs:20px; --b-fw:700; --b-tt:uppercase; --b-ls:.06em; --b-bd:2px solid; --b-bc:rgba(255,255,255,.18); --b-on-bg:#ffffff; --b-on-fg:#000; --b-on-bc:#fff;
  --go-bg:#2d9e4b; --go-fg:#fff; --stop-bg:#c62d2d; --stop-fg:#fff;
  --i-bg:rgba(255,255,255,.1); --i-fg:#fff; --i-bd:2px solid rgba(255,255,255,.25); --i-focus:#f0c850; --i-fs:22px;
  --res-sep:rgba(255,255,255,.12); --res-hover:rgba(255,255,255,.12); --tag-bg:#b85ff0; --tag-fg:#fff; --tag-fs:13px; --t1-fs:21px; --t2-fs:16px;
  --bn-bg:rgba(0,0,0,.82); --bn-bd:0 solid; --bn-bc:transparent; --bn-sh:0 4px 18px rgba(0,0,0,.5); --bn-fg:#fff; --bn-acc:#fff; --bn-dist-fs:34px; --bn-text-fs:24px; --bn-name-fs:20px;
  --th-bg:rgba(0,0,0,.82); --th-fg:#fff; --th-bd:0 solid; --then-fs:18px;
  --h-wrap:transparent; --h-gap:6px; --h-bg:rgba(255,255,255,.1); --h-bd:2px solid; --h-bc:rgba(255,255,255,.18); --h-fg:#fff; --h-fs:18px; --h-sel-bg:#ffffff; --h-sel-fg:#000;
  --title-ff:var(--fh); --title-fs:28px; --sum-fs:20px; --sum-big-fs:22px; --stat-fs:22px; --small-fs:15px; --toast-fs:19px;
  --bar-h:10px; --bar-bg:rgba(45,158,75,.3); --bar-bd:0 solid; --bar-fill:#59c46c; --bar-segop:0; --lvl-d:none; --bar-mt:2px;
  --t-bg:rgba(0,0,0,.85); --t-fg:#fff; --t-bd:0 solid;
  --boot-bg:#111; --me-halo:rgba(255,255,255,.25);
}
html[data-skin="street"] .xp{box-shadow:0 14px 0 -4px rgba(78,165,215,.35)}
html[data-skin="street"] #adv{left:0;right:0;top:30%;flex-direction:column;gap:2px;text-align:center;transform:scale(1.25)}
html[data-skin="street"] #adv.show{transform:none}
html[data-skin="street"] #adv .slot{display:none}
html[data-skin="street"] #advTitle{font-family:var(--fh);font-size:52px;color:#f0c850;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000;letter-spacing:.02em;line-height:1}
html[data-skin="street"] #advText{font-size:24px;color:#fff;text-shadow:0 2px 4px #000;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* ============ THEME: Neon City ============ */
html[data-skin="neon"]{
  --fb:"Rajdhani",system-ui,sans-serif; --fh:"Orbitron","Rajdhani",sans-serif; --fs:18px;
  --map-bg:#07090e; --focus:#00f0ff; --accent:#fcee0a;
  --p-clip:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  --p-bg:linear-gradient(135deg,rgba(14,17,26,.96),rgba(7,9,14,.96)); --p-fg:#e9fbff; --p-mut:#7fa9b3; --p-bd:2px solid; --p-bc:#00d2ff; --p-sh:none;
  --s-bg:#0d1520; --s-bd:2px solid; --s-bc:#fcee0a;
  --b-clip:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  --b-bg:#fcee0a; --b-fg:#08090c; --b-fs:18px; --b-fw:700; --b-tt:uppercase; --b-ls:.08em; --b-bd:0 solid; --b-bc:transparent; --b-on-bg:#00f0ff; --b-on-fg:#000;

<script>
"use strict";
/* ================= utils ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('bn_'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bn_'+k, JSON.stringify(v)); }catch(e){} }
};
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R2D = 180/Math.PI, D2R = Math.PI/180;
function distLL(a, b){
  const la1=a[1]*D2R, la2=b[1]*D2R, dla=la2-la1, dlo=(b[0]-a[0])*D2R;
  const h = Math.sin(dla/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 12742000*Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingLL(a, b){
  const la1=a[1]*D2R, la2=b[1]*D2R, dlo=(b[0]-a[0])*D2R;
  const y=Math.sin(dlo)*Math.cos(la2), x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dlo);
  return (Math.atan2(y,x)*R2D+360)%360;
}
async function getJSON(url, ms=12000){
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), ms);
  try{ const r = await fetch(url, {signal: ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

/* ================= texture + icon toolkit ================= */
function texCanvas(draw, n){ const c=document.createElement('canvas'); c.width=c.height=n; draw(c.getContext('2d'), n); return c; }
function texImage(c, scale){
  const n=c.width, src=c.getContext('2d').getImageData(0,0,n,n).data, W=n*scale, out=new Uint8Array(W*W*4);
  for(let y=0;y<W;y++) for(let x=0;x<W;x++){ const si=(((y/scale)|0)*n+((x/scale)|0))*4, di=(y*W+x)*4; out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=255; }
  return {width:W, height:W, data:out};
}
function canvasURL(c, scale){ const o=document.createElement('canvas'); o.width=o.height=c.width*scale; const x=o.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(c,0,0,o.width,o.height); return o.toDataURL(); }
const noise = (cols, seed, extra) => (x, n) => { const r=rng(seed); for(let i=0;i<n;i++) for(let j=0;j<n;j++){ x.fillStyle=cols[(r()*cols.length)|0]; x.fillRect(i,j,1,1); } if(extra) extra(x,n,r); };
function pix(w, h, draw, {outline='#1b1b1b', scale=4} = {}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x);
  const d=x.getImageData(0,0,w,h), a=d.data, solid=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){ if(a[i*4+3]>110){ solid[i]=1; a[i*4+3]=255; } else a[i*4+3]=0; }
  if(outline){ const oc=parseInt(outline.slice(1),16); for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=y*w+xx; if(solid[i]) continue;
      if((xx>0&&solid[i-1])||(xx<w-1&&solid[i+1])||(y>0&&solid[i-w])||(y<h-1&&solid[i+w])){ a[i*4]=oc>>16; a[i*4+1]=(oc>>8)&255; a[i*4+2]=oc&255; a[i*4+3]=255; } } }
  x.putImageData(d,0,0);
  const o=document.createElement('canvas'); o.width=w*scale; o.height=h*scale; const ox=o.getContext('2d'); ox.imageSmoothingEnabled=false; ox.drawImage(c,0,0,o.width,o.height); return o.toDataURL();
}
function smooth(w, h, draw, {glow=null, shadow=null, scale=4} = {}){
  const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale; const x=c.getContext('2d'); x.scale(scale,scale);
  if(glow){ x.shadowColor=glow; x.shadowBlur=10; } else if(shadow){ x.shadowColor=shadow; x.shadowBlur=4; x.shadowOffsetX=1.5; x.shadowOffsetY=1.5; }
  draw(x); return c.toDataURL();
}
function grid(rows, pal, scale=4){
  const h=rows.length, w=rows[0].length, c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale; const x=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,xx)=>{ if(pal[ch]){ x.fillStyle=pal[ch]; x.fillRect(xx*scale,y*scale,scale,scale);} })); return c.toDataURL();

/* shapes drawn in a 24-unit box */
const MOD_ANGLE = {'straight':0,'slight right':45,'right':90,'sharp right':135,'slight left':-45,'left':-90,'sharp left':-135};
const SHAPE = {
  arrow: angle => (x,fg) => { x.strokeStyle=x.fillStyle=fg; x.lineWidth=3.6; x.lineJoin='miter';
    const a=angle*D2R, sx=Math.sin(a), cyy=Math.cos(a), cx=12, cy=13, L=7, tx=cx+sx*L, ty=cy-cyy*L;
    x.beginPath(); x.moveTo(cx,22); x.lineTo(cx,cy); x.lineTo(tx-sx*2, ty+cyy*2); x.stroke();
    const hx=tx+sx*2.5, hy=ty-cyy*2.5, px=cyy, py=sx, bx=tx-sx*3, by=ty+cyy*3;
    x.beginPath(); x.moveTo(hx,hy); x.lineTo(bx+px*5, by+py*5); x.lineTo(bx-px*5, by-py*5); x.closePath(); x.fill(); },
  uturn: () => (x,fg) => { x.strokeStyle=x.fillStyle=fg; x.lineWidth=3.6; x.beginPath(); x.moveTo(17,22); x.lineTo(17,10); x.arc(12,10,5,0,Math.PI,true); x.lineTo(7,14); x.stroke(); x.beginPath(); x.moveTo(7,21); x.lineTo(2.5,14); x.lineTo(11.5,14); x.closePath(); x.fill(); },
  round: mod => (x,fg) => { const ang=(MOD_ANGLE[mod] ?? 45)*D2R; x.strokeStyle=x.fillStyle=fg; x.lineWidth=2.8; x.beginPath(); x.arc(12,12,4.6,0,Math.PI*2); x.stroke(); x.lineWidth=3.4; x.beginPath(); x.moveTo(12,23); x.lineTo(12,16.6); x.stroke();
    const s=Math.sin(ang), c=Math.cos(ang); x.beginPath(); x.moveTo(12+s*4.6,12-c*4.6); x.lineTo(12+s*8,12-c*8); x.stroke(); const tx=12+s*11, ty=12-c*11, bx=12+s*7.5, by=12-c*7.5; x.beginPath(); x.moveTo(tx,ty); x.lineTo(bx+c*3.6,by+s*3.6); x.lineTo(bx-c*3.6,by-s*3.6); x.closePath(); x.fill(); },
  flag: f => x => { x.fillStyle=f.ground; x.fillRect(3,19,12,4); x.fillStyle=f.soil; x.fillRect(3,22,12,1); x.strokeStyle=f.pole; x.lineWidth=2.4; x.beginPath(); x.moveTo(7,3); x.lineTo(7,20); x.stroke(); x.fillStyle=f.cloth; x.fillRect(8,3,11,8); x.fillStyle=f.mark; x.fillRect(11,6,4,2); },

function fmtDist(m, voice){
  const nl = lang==='nl';
  if(m < 950){ const v = m<100 ? Math.max(5, Math.round(m/5)*5) : Math.round(m/10)*10; return voice ? `${v} ${nl?'meter':'meters'}` : `${v} m`; }
  const km = m/1000, s = (km<10 ? km.toFixed(1) : Math.round(km).toString()).replace('.', nl?',':'.');
  return voice ? `${s} ${nl?'kilometer':'kilometers'}` : `${s} km`;
}

function startGPS(){
  if(!('geolocation' in navigator)) { toast(t('denied'), 6000); return; }
  if(!window.isSecureContext){ toast(t('insecure'), 8000); }
  if(watchId!=null) return;
  watchId = navigator.geolocation.watchPosition(p => onPos(p,false), err => {
    if(err.code===1) toast(window.isSecureContext ? t('denied') : t('insecure'), 7000);
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
function onPos(p, simulated){
  if(sim && !simulated) return;
  const c=p.coords, cur=[c.longitude,c.latitude];
  let heading = me ? me.heading : null;
  if(c.heading!=null && !isNaN(c.heading) && (c.speed||0) > 0.8) heading = c.heading;
  else if(lastHeadPos && distLL(lastHeadPos,cur) > 8) heading = bearingLL(lastHeadPos,cur);
  else if(compassHeading!=null && (c.speed||0) < 0.8) heading = compassHeading;
  if(!lastHeadPos || distLL(lastHeadPos,cur) > 8) lastHeadPos = cur;
  me = {lat:c.latitude, lon:c.longitude, acc:c.accuracy||0, speed:c.speed, heading};
  if(state==='nav' && route) navTick();
  updateMeMarker();
  $('#spdVal').textContent = c.speed!=null && c.speed>=0 ? Math.round(c.speed*3.6) : '–';
  if(!firstFix){ firstFix=true; if(state==='browse'){ map.jumpTo({center:cur, zoom:Math.max(map.getZoom(),16)}); setFollow(true); } }
  else if(state==='browse' && follow) map.easeTo({center:cur, duration:800});

}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) h = (360 - e.alpha) % 360;
  if(h!=null){ compassHeading = h; if(me && (me.speed==null || me.speed<0.8) && state!=='nav'){ me.heading=h; updateMeMarker(); } }
}

async function enableCompass(){

}

let qTimer=null, qSeq=0;
const resultsEl=$('#results');
$('#q').addEventListener('input', () => { const v=$('#q').value.trim(); $('#qClear').hidden=!v; clearTimeout(qTimer); if(v.length<3){ v ? resultsEl.innerHTML='' : showQuick(); return; } qTimer=setTimeout(()=>search(v), 320); });
$('#q').addEventListener('focus', () => { if(!$('#q').value.trim()) showQuick(); });
$('#q').addEventListener('keydown', e => { if(e.key==='Enter'){ const f=resultsEl.querySelector('.res'); if(f) f.click(); } if(e.key==='Escape'){ $('#q').blur(); resultsEl.innerHTML=''; } });
$('#qClear').addEventListener('click', () => { $('#q').value=''; $('#qClear').hidden=true; resultsEl.innerHTML=''; $('#q').focus(); });
document.addEventListener('pointerdown', e => { if(!e.target.closest('#searchPanel')) resultsEl.innerHTML=''; });
function resItem(tag, t1, t2, onPick){
  const d=document.createElement('div'); d.className='res'; d.tabIndex=0; d.setAttribute('role','option');
  d.innerHTML=`<span class="tag"></span><div><div class="t1"></div><div class="t2"></div></div>`;
  d.querySelector('.tag').textContent=tag; d.querySelector('.t1').textContent=t1; d.querySelector('.t2').textContent=t2||'';
  d.addEventListener('click', onPick); d.addEventListener('keydown', e=>{ if(e.key==='Enter') onPick(); });
  return d;
}
function showQuick(){
  resultsEl.innerHTML=''; const home=store.get('home',null);
  if(home) resultsEl.appendChild(resItem(t('tagHome'), home.name, home.sub, ()=>pick(home)));
  store.get('recent',[]).slice(0,5).forEach(r=>resultsEl.appendChild(resItem(t('tagRecent'), r.name, r.sub, ()=>pick(r))));
}
async function search(q){
  const seq=++qSeq; resultsEl.innerHTML=''; resultsEl.appendChild(resItem('…', t('searching'), '', ()=>{}));
  const c = me ? {lat:me.lat,lon:me.lon} : (()=>{ const m=map.getCenter(); return {lat:m.lat,lon:m.lng}; })();
  let items=[];
  try{
    const j = await getJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lat=${c.lat.toFixed(4)}&lon=${c.lon.toFixed(4)}`, 8000);
    items = (j.features||[]).map(f=>{ const p=f.properties, [lon,lat]=f.geometry.coordinates;
      const street = p.street ? `${p.street}${p.housenumber?' '+p.housenumber:''}` : '';
      const name = p.name || street || p.city || q;
      const sub = [p.name && street ? street : '', p.postcode, p.city||p.town||p.village, p.country].filter(Boolean).join(', ');
      return {lat, lon, name, sub}; });
  }catch(e){
    try{ const j=await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&q=${encodeURIComponent(q)}`, 8000);
      items=j.map(r=>({lat:+r.lat, lon:+r.lon, name:r.name||r.display_name.split(',')[0], sub:r.display_name.split(',').slice(1,4).join(',').trim()})); }catch(e2){ items=[]; }
  }
  if(seq!==qSeq) return;
  resultsEl.innerHTML='';
  if(!items.length){ resultsEl.appendChild(resItem('!', t('noresults'), '', ()=>{})); return; }
  items.forEach(it=>{ const d = me ? distLL([me.lon,me.lat],[it.lon,it.lat]) : null; resultsEl.appendChild(resItem(d!=null?fmtDist(d):t('tagPlace'), it.name, it.sub, ()=>pick(it))); });
}
function pick(p){
  resultsEl.innerHTML=''; $('#q').value=p.name; $('#qClear').hidden=false; $('#q').blur();
  const rec=store.get('recent',[]).filter(r=>!(Math.abs(r.lat-p.lat)<1e-5 && Math.abs(r.lon-p.lon)<1e-5)); rec.unshift({lat:p.lat,lon:p.lon,name:p.name,sub:p.sub||''}); store.set('recent',rec.slice(0,8));
  selectDest({lat:p.lat, lon:p.lon, name:p.name, sub:p.sub||''});
}
let lpTimer=null, lpStart=null, lastPin=0;
map.on('touchstart', e => { clearTimeout(lpTimer); if(e.originalEvent.touches.length!==1 || state==='nav') return; lpStart=e.point; const ll=e.lngLat; lpTimer=setTimeout(()=>dropPin(ll), 550); });
map.on('touchmove', e => { if(lpStart && (Math.abs(e.point.x-lpStart.x)>10 || Math.abs(e.point.y-lpStart.y)>10)) clearTimeout(lpTimer); });
['touchend','touchcancel','zoomstart','rotatestart','pitchstart'].forEach(ev=>map.on(ev,()=>clearTimeout(lpTimer)));
map.on('contextmenu', e => { if(state!=='nav') dropPin(e.lngLat); });
async function dropPin(ll){
  if(Date.now()-lastPin<800) return; lastPin=Date.now(); if(navigator.vibrate) navigator.vibrate(20);
  const p={lat:ll.lat, lon:ll.lng, name:t('pin'), sub:`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`};
  selectDest(p);
  try{ const j=await getJSON(`https://photon.komoot.io/reverse?lat=${ll.lat}&lon=${ll.lng}`, 6000); const f=j.features&&j.features[0];
    if(f && dest===p){ const q=f.properties; const street=q.street?`${q.street}${q.housenumber?' '+q.housenumber:''}`:''; p.name=q.name||street||p.name; p.sub=[q.name&&street?street:'',q.city||q.town||q.village].filter(Boolean).join(', ')||p.sub; renderSheet(); } }catch(e){}
}

/* ================= routing ================= */
async function getRoute(a, b, m){
  const p={car:'car',bike:'bike',walk:'foot'}[m];
  const url=`https://routing.openstreetmap.de/routed-${p}/route/v1/driving/${a.lon.toFixed(6)},${a.lat.toFixed(6)};${b.lon.toFixed(6)},${b.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true&alternatives=false`;
  const j=await getJSON(url, 15000);
  if(j.code!=='Ok' || !j.routes || !j.routes.length) throw new Error('noroute');
  return buildRoute(j.routes[0]);
}
function buildRoute(r){
  const coords=r.geometry.coordinates, cum=[0];
  for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+distLL(coords[i-1],coords[i]));
  const total=cum[cum.length-1]||0, steps=[]; let s=0;
  for(const leg of r.legs) for(const st of leg.steps){ steps.push({maneuver:st.maneuver, name:st.name, ref:st.ref, distance:st.distance, duration:st.duration, s}); s+=st.distance; }
  const k = s>0 ? total/s : 1;
  steps.forEach(st=>{ st.s*=k; st.d=st.distance*k; Object.assign(st, instr(st)); });
  return {coords, cum, total, duration:r.duration, steps};
}
function setRouteData(r){
  const fc = r ? {type:'Feature', geometry:{type:'LineString', coordinates:r.coords}} : {type:'FeatureCollection',features:[]};
  if(map.getSource('route')) map.getSource('route').setData(fc);
  if(map.getSource('routeDone')) map.getSource('routeDone').setData({type:'FeatureCollection',features:[]});
}
function fitRoute(r){
  if(!r || r.coords.length<2) return;
  const b=new maplibregl.LngLatBounds(r.coords[0], r.coords[0]); r.coords.forEach(c=>b.extend(c));
  const sheetH = $('#sheet').offsetHeight || 300;
  map.fitBounds(b, {padding:{top:120, bottom:sheetH+30, left:40, right:80}, pitch:0, bearing:0, duration:900, maxZoom:17});
}

/* ================= preview ================= */
function selectDest(d){
  if(state==='nav') return;
  dest=d; routes={}; route=null; setRouteData(null); setDestMarker();
  state='preview'; document.body.className='preview'; follow=false;
  $('#sheet').hidden=false; $('#attrFloat').hidden=true; renderSheet();
  if(me) fetchAllModes(); else map.easeTo({center:[d.lon,d.lat], zoom:Math.max(map.getZoom(),15)});
}
async function fetchAllModes(){
  if(!me || !dest) return;
  const id=++routeReqId, from={...me}; routes={_loading:true}; renderSheet();
  await Promise.all(['car','bike','walk'].map(async m=>{
    try{ const r=await getRoute(from,dest,m); if(id!==routeReqId) return; routes[m]=r; }catch(e){ if(id!==routeReqId) return; routes[m]=null; }
    if(m===mode){ route=routes[m]; setRouteData(route); fitRoute(route); }
    renderSheet();
  }));
  if(id===routeReqId) delete routes._loading;
}
function renderSheet(){
  if(!dest) return;
  $('#dTitle').textContent=dest.name; $('#dSub').textContent=dest.sub||'';
  document.querySelectorAll('.hslot').forEach(b=>{
    const m=b.dataset.mode, r=routes[m], sel=m===mode; b.classList.toggle('sel', sel);
    b.querySelector('img').src=modeIcon(m, sel);
    b.querySelector('span').textContent = r ? fmtDur(r.duration) : (r===null ? '—' : (me ? '…' : '?'));
  });
  const r=routes[mode];
  if(!me) $('#summary').textContent=t('noloc');
  else if(r) $('#summary').innerHTML=`<span class="big">${fmtDur(r.duration)}</span> · ${fmtDist(r.total)} · ${clockIn(r.duration)}`;
  else if(r===null) $('#summary').textContent=t('routeFail');
  else $('#summary').textContent='…';
  $('#btnStart').disabled = !r; $('#btnSim').disabled = !r;
}
document.querySelectorAll('.hslot').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode; store.set('mode',mode); route=routes[mode]||null; setRouteData(route); if(route) fitRoute(route); renderSheet();
}));
$('#btnClose').addEventListener('click', clearDest);
$('#btnHome').addEventListener('click', ()=>{ if(!dest) return; store.set('home',{lat:dest.lat,lon:dest.lon,name:dest.name,sub:dest.sub||''}); toast(t('homeSaved')); });
$('#btnStart').addEventListener('click', ()=>startNav(false));
$('#btnSim').addEventListener('click', ()=>startNav(true));
function clearDest(){
  routeReqId++; dest=null; route=null; routes={}; setRouteData(null); setDestMarker();
  state='browse'; document.body.className=''; $('#sheet').hidden=true; $('#attrFloat').hidden=false; $('#q').value=''; $('#qClear').hidden=true;
  setFollow(false);
}

/* ================= navigation ================= */
function startNav(simulate){
  route = routes[mode]; if(!route) return;
  enableCompass(); requestWake();
  state='nav'; document.body.className='nav'; ann={}; lastIdx=0; offCount=0; navProj=null;
  $('#sheet').hidden=true; $('#skinSheet').hidden=true; $('#searchPanel').hidden=true; $('#banner').hidden=false; $('#navbar').hidden=false; $('#speed').hidden=false; $('#attrFloat').hidden=true;
  layoutSpeed(); setFollow(true);
  if(simulate) startSim(); else navTick();
  const first=route.steps[0]; speak(`${first.text}${first.nameLine?' '+first.nameLine:''}`);
  map.easeTo({pitch:threeD?55:0, zoom:17.5, duration:800});
}
function endNav(){
  stopSim(); releaseWake(); try{ speechSynthesis.cancel(); }catch(e){}
  state='browse'; document.body.className='';
  $('#banner').hidden=true; $('#then').hidden=true; $('#navbar').hidden=true; $('#speed').hidden=true; $('#searchPanel').hidden=false; $('#recenter').hidden=true;
  dest=null; route=null; routes={}; setRouteData(null); setDestMarker(); $('#q').value=''; $('#qClear').hidden=true; $('#attrFloat').hidden=false;
  map.easeTo({pitch:threeD?45:0, bearing:0, zoom:Math.min(map.getZoom(),16), duration:700}); setFollow(true);
}
$('#btnEnd').addEventListener('click', endNav);
$('#recenter').addEventListener('click', ()=>{ setFollow(true); navCamera(true); });
function project(p){
  const c=route.coords, kx=111320*Math.cos(p.lat*D2R), ky=110540; let best={d:Infinity,i:0,t:0,pt:c[0]};
  const scan=(a,b)=>{ for(let i=Math.max(0,a);i<Math.min(c.length-1,b);i++){
    const ax=(c[i][0]-p.lon)*kx, ay=(c[i][1]-p.lat)*ky, bx=(c[i+1][0]-p.lon)*kx, by=(c[i+1][1]-p.lat)*ky, dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
    let tt = L2 ? -(ax*dx+ay*dy)/L2 : 0; tt=Math.max(0,Math.min(1,tt)); const d=Math.hypot(ax+tt*dx, ay+tt*dy);
    if(d<best.d) best={d,i,t:tt,pt:[c[i][0]+(c[i+1][0]-c[i][0])*tt, c[i][1]+(c[i+1][1]-c[i][1])*tt]}; } };
  scan(lastIdx-3, lastIdx+400); if(best.d>60) scan(0, c.length);
  const i=best.i; best.s = route.cum[i] + ((route.cum[i+1]||route.cum[i]) - route.cum[i]) * best.t;
  let j=i; while(j<c.length-1 && c[j][0]===c[j+1][0] && c[j][1]===c[j+1][1]) j++;
  best.bear = j<c.length-1 ? bearingLL(c[j],c[j+1]) : (me&&me.heading)||0;
  lastIdx=i; return best;
}
function navTick(){
  if(!route || !me || route.coords.length<2) return;
  const pr = navProj = project(me), s=pr.s, st=route.steps;
  const lim=(mode==='car'?40:28) + Math.min(me.acc||0,40)*0.5;
  if(pr.d>lim){ offCount++; if(offCount>=3 && Date.now()-lastReroute>8000) reroute(); } else offCount=0;
  let k=st.findIndex((x,i)=>i>0 && x.s > s+3); if(k<0) k=st.length-1;
  const nx=st[k], dNext=Math.max(0, nx.s - s);
  $('#bIcon').src=icon(nx.key); $('#bDist').textContent=fmtDist(dNext); $('#bText').textContent=nx.text; $('#bName').textContent=nx.nameLine;
  const n2=st[k+1];
  if(n2 && n2.s - nx.s < 150 && nx.key!=='arrive'){ $('#then').hidden=false; $('#thenIcon').src=icon(n2.key); } else $('#then').hidden=true;
  const remaining=Math.max(0, route.total - s);
  let rem=0; for(let j=k;j<st.length;j++) rem+=st[j].duration; const prev=st[k-1]; if(prev && prev.d>0) rem+=prev.duration*Math.min(1,Math.max(0,dNext/prev.d));
  $('#nEta').textContent=clockIn(rem); $('#nDist').textContent=fmtDist(remaining);
  $('#xpLevel').textContent=Math.max(0,Math.round(rem/60)); $('#xpFill').style.width=(route.total? Math.min(100, s/route.total*100) : 0)+'%';
  if(map.getSource('routeDone')) map.getSource('routeDone').setData({type:'Feature',geometry:{type:'LineString',coordinates:[...route.coords.slice(0,pr.i+1), pr.pt]}});
  announce(k, nx, dNext);
  if(remaining < 15 || (dest && distLL([me.lon,me.lat],[dest.lon,dest.lat]) < (mode==='car'?30:18))) { arrive(); return; }
  navCamera(false);
}
function navCamera(force){
  if(!follow || !me) return;
  const sp=me.speed||0, z = mode==='car' ? (sp>25?15.8:sp>14?16.6:17.3) : mode==='bike' ? 17.6 : 18.2;
  const onRoute = navProj && navProj.d < 25;
  const center = onRoute ? navProj.pt : [me.lon,me.lat];
  const bearing = onRoute ? navProj.bear : (me.heading!=null ? me.heading : map.getBearing());
  map.easeTo({center, zoom:z, bearing, pitch: threeD?55:0, duration: force?600:(sim?480:950), easing:x=>x, offset:[0, Math.round(window.innerHeight*0.18)]});
}
function announce(k, nx, d){
  const sp=me.speed||8;
  const th = mode==='car' ? [['far',900],['mid',300],['now',Math.max(45, sp*4)]] : mode==='bike' ? [['mid',160],['now',35]] : [['mid',70],['now',15]];
  const done = ann[k] || (ann[k]=new Set()); let chosen=null;
  for(const [tag,lim] of th){ if(d<=lim && !done.has(tag)) chosen=tag; }
  if(!chosen) return;
  for(const [tag] of th){ done.add(tag); if(tag===chosen) break; }
  const segLen = nx.s - (route.steps[k-1] ? route.steps[k-1].s : 0);
  if(chosen==='far' && segLen < 1300) return;
  if(chosen==='now' && nx.key==='arrive') return;
  const phrase = `${nx.text}${nx.nameLine && nx.key!=='arrive' ? ' '+nx.nameLine : ''}`;
  speak(chosen==='now' ? phrase : `${t('in')} ${fmtDist(d,true)}, ${phrase[0].toLowerCase()+phrase.slice(1)}`);
}
async function reroute(){
  if(rerouting || !dest) return; rerouting=true; lastReroute=Date.now(); toast(t('reroute')); speak(t('reroute').replace('…',''));
  try{ const r=await getRoute(me,dest,mode); if(state==='nav'){ route=r; ann={}; lastIdx=0; offCount=0; setRouteData(r); } }catch(e){}
  rerouting=false;
}
function arrive(){
  const name = dest ? dest.name : '';
  speak(t('arrivedVoice'));
  $('#advTitle').textContent = (skin.arrivedText && skin.arrivedText[lang]) || t('arrived');
  $('#advText').textContent=name; $('#advIcon').src=icon('arrive');
  const adv=$('#adv'); adv.classList.add('show'); setTimeout(()=>adv.classList.remove('show'), 5000);
  endNav();
}

/* ================= demo drive ================= */
function pointAt(s){
  const c=route.cum; let lo=0, hi=c.length-1; while(lo<hi-1){ const m=(lo+hi)>>1; if(c[m]<=s) lo=m; else hi=m; }
  const a=route.coords[lo], b=route.coords[hi]||a, seg=(c[hi]-c[lo])||1, f=Math.min(1,Math.max(0,(s-c[lo])/seg));
  return {pt:[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f], bear: a===b ? 0 : bearingLL(a,b)};
}
function startSim(){
  stopSim(); let s=0; const sp={car:16,bike:6,walk:2.2}[mode]*2;
  const tick=()=>{ if(!route || state!=='nav'){ stopSim(); return; }
    s = Math.min(route.total, s + sp*0.5);
    const {pt,bear}=pointAt(s);
    onPos({coords:{latitude:pt[1], longitude:pt[0], accuracy:5, speed:sp, heading:bear}}, true);
  };
  sim = setInterval(tick, 500); tick();
}
function stopSim(){ if(sim){ clearInterval(sim); sim=null; } }

/* ================= voice / wake ================= */
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window) || !text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang = lang==='nl' ? 'nl-NL' : 'en-GB';
    const v=speechSynthesis.getVoices().find(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith(lang)); if(v) u.voice=v; u.rate=1.03; speechSynthesis.speak(u); }catch(e){}
}
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && state==='nav') requestWake(); });

/* ================= controls ================= */
function toast(msg, ms=2600){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), ms); }
function layoutSpeed(){ const b=$('#banner'); $('#speed').style.top = (b.getBoundingClientRect().bottom + 56) + 'px'; }
window.addEventListener('resize', ()=>{ if(state==='nav') layoutSpeed(); });
function layoutRecenter(){ $('#recenter').style.bottom = `calc(${$('#navbar').offsetHeight || 140}px + 16px)`; }
if('ResizeObserver' in window) new ResizeObserver(layoutRecenter).observe($('#navbar'));

$('#btnCenter').addEventListener('click', ()=>{
  enableCompass();
  if(state==='nav'){ setFollow(true); navCamera(true); return; }
  if(!me){ startGPS(); toast(t('noloc')); return; }
  if(follow && Math.abs(map.getBearing())>1) { map.easeTo({bearing:0, duration:500}); return; }
  setFollow(true); map.easeTo({center:[me.lon,me.lat], zoom:Math.max(map.getZoom(),16), duration:700});
});
$('#btn3d').addEventListener('click', ()=>{ threeD=!threeD; store.set('3d',threeD); apply3D(true); });
$('#btnChunky').addEventListener('click', ()=>{ chunky=!chunky; store.set('chunky',chunky); $('#btnChunky').classList.toggle('on',chunky); if(map.setPixelRatio) map.setPixelRatio(pixelRatioFor()); });
$('#btnVoice').addEventListener('click', ()=>{ voiceOn=!voiceOn; store.set('voice',voiceOn); sideIcons(); $('#btnVoice').classList.toggle('on',!voiceOn); if(voiceOn) speak(lang==='nl'?'Spraak aan':'Voice on'); else try{speechSynthesis.cancel()}catch(e){} });
$('#btnLang').addEventListener('click', ()=>{ lang = lang==='nl'?'en':'nl'; store.set('lang',lang); applyLang(); });

/* ================= boot ================= */
(function initTextures(){
  const css = (k, id) => { const tx=texFor(id); if(tx) document.documentElement.style.setProperty(k, `url(${canvasURL(tx.canvas, tx.scale)})`); };
  css('--stoneTex','blocks_stone'); css('--plankTex','blocks_planks'); css('--parchTex','frontier_parch');
})();
applySkin(skin.id, true);
applyLang();
function boot(){ $('#boot').hidden=true; store.set('seen',true); startGPS(); enableCompass(); setTimeout(()=>toast(t('hint'), 3500), 1500); }
if(!store.get('seen', false)){ $('#boot').hidden=false; $('#bootBtn').addEventListener('click', boot); }
else startGPS();
</script>
